<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Leave App - Modern Login</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-glow-1 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            top: 10%;
            left: 15%;
            animation: float 8s ease-in-out infinite alternate;
        }

        .bg-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            bottom: 10%;
            right: 15%;
            animation: float 6s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-30px) scale(1.08); }
        }

        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-logo-container {
            width: 85px;
            height: 85px;
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
            padding: 10px;
            overflow: hidden;
        }

        .brand-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        .login-header h2 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
            font-size: 13px;
        }

        .input-icon-container {
            position: relative;
            width: 100%;
        }

        .input-icon-container > i:not(.toggle-password) {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
            pointer-events: none;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #f8fafc;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 12px;
            font-size: 14px;
            color: #f8fafc;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input[type="password"] {
            padding-right: 42px;
        }

        .form-group select option {
            background-color: #1e293b;
            color: #f8fafc;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #818cf8;
            background: rgba(15, 23, 42, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 28px 18px;
                border-radius: 18px;
            }

            .login-header h2 {
                font-size: 22px;
            }

            .form-group input,
            .form-group select {
                padding-left: 38px;
            }

            .action-links {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .modal-card {
                padding: 24px 18px;
            }
        }

        .action-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 22px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .link-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-card {
            background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-card h3 { color: #fff; text-align: center; font-size: 20px; margin-bottom: 10px; }
        .modal-card p { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 20px; }
        .close-btn { position: absolute; top: 18px; right: 22px; font-size: 20px; cursor: pointer; color: #94a3b8; }
        .close-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="brand-logo-container">
                <img src="jd.jpg" alt="JD Logo">
            </div>
            <h2>Office Leave Portal</h2>
            <p>તમારું એકાઉન્ટ લોગિન કરો</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">ઈમેઈલ (Email) *</label>
                <div class="input-icon-container">
                    <input type="email" id="email" placeholder="example@company.com" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password">પાસવર્ડ *</label>
                <div class="input-icon-container">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                    <i class="fa-solid fa-eye toggle-password" data-target="password"></i>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">
                <span id="loginBtnText">Login</span>
                <i class="fa-solid fa-arrow-right" id="loginBtnIcon"></i>
            </button>

            <div class="action-links">
                <a class="link-btn" id="openForgotBtn"><i class="fa-solid fa-key"></i> Reset Password?</a>
            </div>
        </form>
    </div>

    <!-- Reset Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal-card">
            <span class="close-btn" id="closeForgotBtn"><i class="fa-solid fa-xmark"></i></span>
            <h3><i class="fa-solid fa-key" style="color: #38bdf8; margin-right: 8px;"></i>Reset Password</h3>
            <p>તમારા નોંધાયેલા ઈમેઈલ પર પાસવર્ડ રીસેટ કરવાની લિંક મોકલવામાં આવશે.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label>તમારો ઈમેઈલ (Email) *</label>
                    <div class="input-icon-container">
                        <input type="email" id="forgotEmail" placeholder="example@company.com" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                </div>
                <button type="submit" id="forgotBtn" class="login-btn" style="background: linear-gradient(135deg, #0284c7, #0369a1);">
                    <span id="forgotBtnText">Send Reset Link</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAfEKSL3dLQ-v1NEtC0PQ7zpNx7STutZs8",
            authDomain: "office-leave-app.firebaseapp.com",
            databaseURL: "https://office-leave-app-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "office-leave-app",
            storageBucket: "office-leave-app.appspot.com",
            messagingSenderId: "609769671596",
            appId: "1:609769671596:web:6a855afe57bf73b7240809"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const LOCAL_USERS_KEY = 'office_leave_local_users';

        function getLocalUsers() {
            try {
                return JSON.parse(localStorage.getItem(LOCAL_USERS_KEY)) || {};
            } catch (error) {
                return {};
            }
        }

        function saveLocalUser(userData) {
            const users = getLocalUsers();
            const emailKey = String(userData.email || '').trim().toLowerCase();
            if (!emailKey) return;
            users[emailKey] = {
                ...userData,
                password: userData.password || '',
                role: userData.role || 'Employee',
                department: userData.department || '',
                createdAt: userData.createdAt || new Date().toISOString()
            };
            localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users));
        }

        function getLocalUser(email) {
            const users = getLocalUsers();
            return users[String(email || '').trim().toLowerCase()] || null;
        }

        async function resolveDepartmentFromFirebase(email, name) {
            const targetEmail = String(email || '').trim().toLowerCase();
            const targetName = String(name || '').trim().toLowerCase();
            if (!targetEmail && !targetName) return '';

            try {
                const snapshot = await db.ref('users').once('value');
                const allUsers = snapshot.val() || {};
                const userList = Object.values(allUsers);

                for (const user of userList) {
                    if (!user || typeof user !== 'object') continue;

                    const userEmail = String(user.email || '').trim().toLowerCase();
                    const userName = String(user.name || user.fullName || '').trim().toLowerCase();
                    const emailMatch = targetEmail && userEmail && userEmail === targetEmail;
                    const nameMatch = targetName && userName && userName === targetName;

                    if (emailMatch || nameMatch) {
                        const candidateDepartment = user.department || user.dept || user.departments;
                        if (Array.isArray(candidateDepartment) && candidateDepartment.length > 0) {
                            return String(candidateDepartment[0]).trim();
                        }
                        if (candidateDepartment && typeof candidateDepartment === 'object') {
                            const deptValue = Object.values(candidateDepartment).find(Boolean);
                            if (deptValue) return String(deptValue).trim();
                        }
                        if (candidateDepartment) {
                            return String(candidateDepartment).trim();
                        }
                    }
                }
            } catch (error) {
                console.warn('Department lookup from Firebase failed:', error);
            }

            return '';
        }

        const getCleanKey = (email) => String(email || '').trim().toLowerCase().replace(/[.#$\[\]]/g, "_");

        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            try {
                const parsedUser = JSON.parse(savedUser);
                if (parsedUser && (parsedUser.email || parsedUser.name || parsedUser.role)) {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                localStorage.removeItem('loggedInUser');
            }
        }

        document.getElementById('openForgotBtn').addEventListener('click', () => {
            document.getElementById('forgotModal').style.display = 'flex';
        });
        document.getElementById('closeForgotBtn').addEventListener('click', () => {
            document.getElementById('forgotModal').style.display = 'none';
        });

        document.querySelectorAll('.toggle-password').forEach(icon => {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                if (!passwordInput) return;

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.classList.remove('fa-eye');
                    this.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    this.classList.remove('fa-eye-slash');
                    this.classList.add('fa-eye');
                }
            });
        });

        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim().toLowerCase();
            const forgotBtn = document.getElementById('forgotBtn');
            const forgotBtnText = document.getElementById('forgotBtnText');
            forgotBtn.disabled = true;
            forgotBtnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> લિંક મોકલાઈ રહી છે...';

            try {
                await auth.sendPasswordResetEmail(email);
                alert('✅ પાસવર્ડ રીસેટ કરવાની લિંક તમારા ઈમેઈલ પર મોકલી દેવામાં આવી છે! કૃપા કરીને તમારું ઇમેઇલ ચેક કરો.');
                document.getElementById('forgotModal').style.display = 'none';
                document.getElementById('forgotForm').reset();
            } catch (error) {
                alert('❌ ભૂલ: ' + (error && error.message ? error.message : 'Reset failed'));
            } finally {
                forgotBtn.disabled = false;
                forgotBtnText.innerText = 'Send Reset Link';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            const loginBtn = document.getElementById('loginBtn');
            const loginBtnText = document.getElementById('loginBtnText');
            const loginBtnIcon = document.getElementById('loginBtnIcon');

            loginBtn.disabled = true;
            loginBtnText.innerText = 'લૉગિન થઈ રહ્યું છે...';
            loginBtnIcon.className = 'fa-solid fa-spinner fa-spin';

            try {
                let userProfile = null;

                try {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    const userKey = getCleanKey(email);
                    const snapshot = await db.ref('users/' + userKey).once('value');
                    userProfile = snapshot.exists() ? snapshot.val() : { uid: userCredential.user.uid, email, name: email.split('@')[0], role: 'Employee' };
                    userProfile.password = password;
                } catch (firebaseError) {
                    const localUser = getLocalUser(email);
                    if (!localUser || localUser.password !== password) {
                        throw firebaseError;
                    }
                    userProfile = { ...localUser, password };
                }

                if (!userProfile) {
                    throw new Error('User profile not found.');
                }

                if (userProfile.deleted === true || userProfile.accountStatus === 'inactive') {
                    throw new Error(userProfile.deleted === true
                        ? 'આ એકાઉન્ટ મેનેજમેન્ટ દ્વારા ડિલીટ કરવામાં આવ્યું છે.'
                        : 'આ એકાઉન્ટ હાલમાં inactive છે. મેનેજમેન્ટનો સંપર્ક કરો.');
                }

                const matchedDepartment = await resolveDepartmentFromFirebase(userProfile.email || email, userProfile.name || userProfile.fullName || email.split('@')[0]);
                const profileToStore = {
                    uid: userProfile.uid || String(Date.now()),
                    name: userProfile.name || userProfile.fullName || email.split('@')[0],
                    email: userProfile.email || email,
                    company: userProfile.company || userProfile.companyName || '',
                    companyName: userProfile.companyName || userProfile.company || '',
                    role: userProfile.role || 'Employee',
                    department: matchedDepartment || userProfile.department || 'N/A',
                    createdAt: userProfile.createdAt || new Date().toISOString(),
                    password
                };

                localStorage.setItem('loggedInUser', JSON.stringify(profileToStore));
                saveLocalUser(profileToStore);

                alert('✅ લોગિન સફળ!');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('❌ લોગિન નિષ્ફળ: ' + (error && error.message ? error.message : 'Authentication failed'));
            } finally {
                loginBtn.disabled = false;
                loginBtnText.innerText = 'Login';
                loginBtnIcon.className = 'fa-solid fa-arrow-right';
            }
        });
    </script>
</body>
</html>
