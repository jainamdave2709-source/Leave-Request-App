<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard - Leave Overview</title>
    
    <!-- Excel Export માટે SheetJS લાઈબ્રેરી -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- PDF Export માટે jsPDF લાઈબ્રેરીઓ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background-color: #0f172a;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .navbar h2 {
            font-size: 20px;
        }

        .logout-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Container */
        .container {
            max-width: 1350px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Stats Cards Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .card.active-card {
            border: 2px solid #4f46e5;
            background-color: #eef2ff;
        }

        .card h3 {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
        }

        /* Section Box */
        .section-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* Filter Header */
        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group input, 
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        /* Export Buttons */
        .export-btn-group {
            display: flex;
            gap: 10px;
        }

        .export-btn {
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
        }

        .btn-excel { background-color: #10b981; }
        .btn-excel:hover { background-color: #059669; }

        .btn-pdf { background-color: #ef4444; }
        .btn-pdf:hover { background-color: #dc2626; }

        /* Table */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        th {
            background-color: #f8fafc;
            color: #334155;
            font-weight: 700;
        }

        .leave-details-cell {
            font-weight: 600;
            color: #1e293b;
        }

        /* Badges & Status */
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge.company { background-color: #e0e7ff; color: #3730a3; }
        .badge.dept { background-color: #f1f5f9; color: #334155; }

        .status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .status.approved { background-color: #d1fae5; color: #059669; }
        .status.rejected { background-color: #fee2e2; color: #dc2626; }
        .status.pending { background-color: #fef3c7; color: #d97706; }
        .status.blocked { background-color: #475569; color: #ffffff; }

        /* Action Buttons */
        .action-btns {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .btn-action {
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .btn-approve { background-color: #10b981; }
        .btn-approve:hover { background-color: #059669; }

        .btn-reject { background-color: #ef4444; }
        .btn-reject:hover { background-color: #dc2626; }

        .btn-edit { background-color: #3b82f6; }
        .btn-edit:hover { background-color: #2563eb; }

        .btn-delete { background-color: #64748b; }
        .btn-delete:hover { background-color: #475569; }

        .btn-block { background-color: #f59e0b; }
        .btn-block:hover { background-color: #d97706; }

        .btn-unblock { background-color: #8b5cf6; }
        .btn-unblock:hover { background-color: #7c3aed; }

        .blocked-row {
            opacity: 0.6;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <div class="navbar">
        <h2 id="managementWelcomeTitle">Welcome, Management Admin</h2>
        <div>
            <button class="logout-btn" onclick="alert('Logged Out!')">Logout</button>
        </div>
    </div>

    <div class="container">
        <!-- Overview Cards -->
        <div class="stats-grid">
            <div class="card active-card" id="cardUsers" onclick="filterByCard('ALL')">
                <h3>TOTAL LEAVES</h3>
                <p style="color: #3b82f6;" id="totalUsersText">0</p>
            </div>
            
            <div class="card" id="cardApproved" onclick="filterByCard('approved')">
                <h3>APPROVED LEAVES</h3>
                <p style="color: #10b981;" id="approvedCountText">0</p>
            </div>
            <div class="card" id="cardRejected" onclick="filterByCard('rejected')">
                <h3>REJECTED LEAVES</h3>
                <p style="color: #ef4444;" id="rejectedCountText">0</p>
            </div>
            
            <div class="card" id="cardPending" onclick="filterByCard('pending')">
                <h3>PENDING APPROVAL</h3>
                <p style="color: #f59e0b;" id="pendingCountText">0</p>
            </div>
            
            <div class="card" id="cardMonth" onclick="filterByCard('MONTH')">
                <h3 id="currentMonthCardTitle">AUGUST LEAVES</h3>
                <p id="currentMonthLeavesCount" style="color: #6366f1;">0</p>
            </div>
        </div>

        <!-- Section Box -->
        <div class="section-box">
            
            <!-- Filters, Search & Export -->
            <div class="filter-bar">
                <div class="filter-group">
                    <input type="text" id="searchInput" onkeyup="filterData()" placeholder="🔍 નામથી સર્ચ કરો...">

                    <select id="companyFilter" onchange="filterData()">
                        <option value="ALL">All Companies</option>
                        <option value="WEBSANKUL">WEBSANKUL</option>
                        <option value="HOUSIVITY">HOUSIVITY</option>
                    </select>

                    <select id="deptFilter" onchange="filterData()">
                        <option value="ALL">All Departments</option>
                        <option value="FACULTY">FACULTY</option>
                        <option value="GRAPHIC">GRAPHIC</option>
                        <option value="IT">IT</option>
                        <option value="MARKETING">MARKETING</option>
                    </select>

                    <select id="statusFilter" onchange="filterData()">
                        <option value="ALL">All Status</option>
                        <option value="approved">Approved</option>
                        <option value="pending">Pending</option>
                        <option value="rejected">Rejected</option>
                        <option value="blocked">Blocked</option>
                    </select>

                    <select id="monthFilter" onchange="filterData()">
                        <option value="ALL">All Months</option>
                        <option value="01">જાન્યુઆરી (Jan)</option>
                        <option value="02">ફેબ્રુઆરી (Feb)</option>
                        <option value="03">માર્ચ (Mar)</option>
                        <option value="04">એપ્રિલ (Apr)</option>
                        <option value="05">મે (May)</option>
                        <option value="06">જૂન (Jun)</option>
                        <option value="07">જુલાઈ (Jul)</option>
                        <option value="08">ઓગસ્ટ (Aug)</option>
                        <option value="09">સપ્ટેમ્બર (Sep)</option>
                        <option value="10">ઓક્ટોબર (Oct)</option>
                        <option value="11">નવેમ્બર (Nov)</option>
                        <option value="12">ડિસેમ્બર (Dec)</option>
                    </select>
                </div>

                <div class="export-btn-group">
                    <button class="export-btn btn-excel" onclick="exportToExcel()">📊 Export Excel</button>
                    <button class="export-btn btn-pdf" onclick="exportToPDF()">📄 Export PDF</button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-responsive">
                <table id="leaveTable">
                    <thead>
                        <tr>
                            <th>Report Date</th>
                            <th>Company</th>
                            <th>Dept</th>
                            <th>Employee / TL Name</th>
                            <th>Leave Details</th>
                            <th>Reason</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Approved By</th>
                            <th style="min-width: 220px;">Action (Management)</th>
                        </tr>
                    </thead>
                    <tbody id="managementTable">
                        <!-- Firebase દ્વારા ડેટા ડાયનેમિકલી લોડ થશે -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAFekL3dLq-v1NETC0PQ7zpnX7StutZs8",
            authDomain: "office-leave-app.firebaseapp.com",
            projectId: "office-leave-app",
            storageBucket: "office-leave-app.appspot.com",
            messagingSenderId: "609769671596",
            appId: "1:609769671596:web:6a855afe57bf73b7240809"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global variables for access in regular functions
        window.firebaseDB = db;
        window.firebaseRef = ref;
        window.firebaseUpdate = update;
        window.firebaseRemove = remove;

        // Dynamic Month Title Update
        const monthNames = ["જાન્યુઆરી", "ફેબ્રુઆરી", "માર્ચ", "એપ્રિલ", "મે", "જૂન", "જુલાઈ", "ઓગસ્ટ", "સપ્ટેમ્બર", "ઓક્ટોબર", "નવેમ્બર", "ડિસેમ્બર"];
        const currentMonthName = monthNames[new Date().getMonth()];
        document.getElementById('currentMonthCardTitle').innerText = `${currentMonthName.toUpperCase()} LEAVES`;

        // Fetch Data from Firebase (Real-time)
        const leavesRef = ref(db, 'leaves');
        onValue(leavesRef, (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('managementTable');
            tableBody.innerHTML = '';

            let totalLeavesCount = 0;
            if (data) {
                Object.keys(data).forEach((key) => {
                    const leave = data[key];
                    totalLeavesCount++;

                    let statusClass = 'pending';
                    let statusText = leave.status || 'Pending';
                    if (statusText.toLowerCase() === 'approved') statusClass = 'approved';
                    else if (statusText.toLowerCase() === 'rejected') statusClass = 'rejected';
                    else if (statusText.toLowerCase() === 'blocked') statusClass = 'blocked';

                    const isBlocked = statusText.toLowerCase() === 'blocked';

                    const row = document.createElement('tr');
                    row.setAttribute('data-id', key);
                    row.setAttribute('data-date', leave.date || '');
                    row.setAttribute('data-company', leave.company || '');
                    row.setAttribute('data-dept', leave.dept || '');
                    row.setAttribute('data-status', statusText.toLowerCase());
                    if (isBlocked) row.classList.add('blocked-row');

                    row.innerHTML = `
                        <td class="date-cell">${leave.date || '-'}</td>
                        <td><span class="badge company">${leave.company || '-'}</span></td>
                        <td><span class="badge dept">${leave.dept || '-'}</span></td>
                        <td class="emp-name">${leave.name || '-'}</td>
                        <td class="leave-details-cell">${leave.leaveDetails || '-'}</td>
                        <td class="reason-cell">${leave.reason || '-'}</td>
                        <td class="days-cell">${leave.days || '1.0'}</td>
                        <td class="status-cell"><span class="status ${statusClass}">${statusText}</span></td>
                        <td class="approver-cell">${leave.approvedBy || '-'}</td>
                        <td class="action-cell">
                            <div class="action-btns">
                                ${statusText.toLowerCase() === 'pending' ? `
                                    <button class="btn-action btn-approve" onclick="approveLeave('${key}')">Approve</button>
                                    <button class="btn-action btn-reject" onclick="rejectLeave('${key}')">Reject</button>
                                ` : ''}
                                <button class="btn-action btn-edit" onclick="editRow('${key}', '${leave.reason || ''}', '${leave.days || '1.0'}')" title="Edit Record">✏️ Edit</button>
                                <button class="btn-action ${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlockRow('${key}', '${statusText}')" title="Block/Unblock">${isBlocked ? '🔓 Unblock' : '🚫 Block'}</button>
                                <button class="btn-action btn-delete" onclick="deleteRow('${key}')" title="Delete Record">🗑️ Delete</button>
                            </div>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            
            document.getElementById('totalUsersText').innerText = totalLeavesCount;
            updateDashboardStats();
            filterData();
        });
    </script>

    <script>
        // MANAGEMENT APPROVE ACTION
        function approveLeave(leaveId) {
            const dbRef = window.firebaseRef(window.firebaseDB, 'leaves/' + leaveId);
            window.firebaseUpdate(dbRef, {
                status: 'Approved',
                approvedBy: 'Admin (Management)'
            }).then(() => {
                // Realtime listener will handle UI update automatically
            }).catch((error) => {
                alert("ભૂલ થઈ છે: " + error.message);
            });
        }

        // MANAGEMENT REJECT ACTION
        function rejectLeave(leaveId) {
            const dbRef = window.firebaseRef(window.firebaseDB, 'leaves/' + leaveId);
            window.firebaseUpdate(dbRef, {
                status: 'Rejected',
                approvedBy: 'Admin (Management)'
            }).then(() => {
                // Realtime listener will handle UI update automatically
            }).catch((error) => {
                alert("ભૂલ થઈ છે: " + error.message);
            });
        }

        // EDIT ROW
        function editRow(leaveId, currentReason, currentDays) {
            const newReason = prompt(`રજાનું નવું કારણ લખો:`, currentReason);
            if (newReason === null) return;

            const newDays = prompt(`દિવસો બદલો (0.5 કે 1.0):`, currentDays);
            if (newDays === null) return;

            const dbRef = window.firebaseRef(window.firebaseDB, 'leaves/' + leaveId);
            window.firebaseUpdate(dbRef, {
                reason: newReason.trim(),
                days: newDays.trim()
            }).then(() => {
                // Realtime listener will handle UI update automatically
            }).catch((error) => {
                alert("ભૂલ થઈ છે: " + error.message);
            });
        }

        // DELETE ROW
        function deleteRow(leaveId) {
            if (confirm(`શું તમે ખરેખર આ રજાની નોંધ ડિલીટ કરવા માગો છો?`)) {
                const dbRef = window.firebaseRef(window.firebaseDB, 'leaves/' + leaveId);
                window.firebaseRemove(dbRef).then(() => {
                    // Realtime listener will handle UI update automatically
                }).catch((error) => {
                    alert("ભૂલ થઈ છે: " + error.message);
                });
            }
        }

        // BLOCK / UNBLOCK USER
        function toggleBlockRow(leaveId, currentStatus) {
            const newStatus = (currentStatus.toLowerCase() === 'blocked') ? 'Pending' : 'Blocked';
            
            if (newStatus === 'Blocked' && !confirm(`શું તમે આ યુઝરને બ્લોક કરવા માગો છો?`)) {
                return;
            }

            const dbRef = window.firebaseRef(window.firebaseDB, 'leaves/' + leaveId);
            window.firebaseUpdate(dbRef, {
                status: newStatus
            }).then(() => {
                // Realtime listener will handle UI update automatically
            }).catch((error) => {
                alert("ભૂલ થઈ છે: " + error.message);
            });
        }

        // CARD CLICK FILTER FUNCTION
        function filterByCard(cardType) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
            const statusSelect = document.getElementById('statusFilter');

            if (cardType === 'ALL') {
                statusSelect.value = 'ALL';
                document.getElementById('monthFilter').value = 'ALL';
                document.getElementById('cardUsers').classList.add('active-card');
            } else if (cardType === 'pending') {
                statusSelect.value = 'pending';
                document.getElementById('cardPending').classList.add('active-card');
            } else if (cardType === 'approved') {
                statusSelect.value = 'approved';
                document.getElementById('cardApproved').classList.add('active-card');
            } else if (cardType === 'rejected') {
                statusSelect.value = 'rejected';
                document.getElementById('cardRejected').classList.add('active-card');
            } else if (cardType === 'MONTH') {
                statusSelect.value = 'approved';
                const currentMonthStr = String(new Date().getMonth() + 1).padStart(2, '0');
                document.getElementById('monthFilter').value = currentMonthStr;
                document.getElementById('cardMonth').classList.add('active-card');
            }
            filterData();
        }

        // Dynamic Counters update
        function updateDashboardStats() {
            const rows = document.querySelectorAll('#managementTable tr');
            let approved = 0, rejected = 0, pending = 0, currentMonthApproved = 0;

            const today = new Date();
            const currentMonthStr = String(today.getMonth() + 1).padStart(2, '0');

            rows.forEach(row => {
                const status = row.getAttribute('data-status');
                const rowDate = row.getAttribute('data-date');

                if (status === 'approved') approved++;
                if (status === 'rejected') rejected++;
                if (status === 'pending') pending++;

                if (rowDate) {
                    const rowMonth = rowDate.split('-')[1];
                    if (rowMonth === currentMonthStr && status === 'approved') {
                        currentMonthApproved++;
                    }
                }
            });

            document.getElementById('approvedCountText').innerText = approved;
            document.getElementById('rejectedCountText').innerText = rejected;
            document.getElementById('pendingCountText').innerText = pending;
            document.getElementById('currentMonthLeavesCount').innerText = currentMonthApproved;
        }

        // Filter Logic
        function filterData() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedCompany = document.getElementById('companyFilter').value;
            const selectedDept = document.getElementById('deptFilter, #deptFilter').value || document.getElementById('deptFilter').value;
            const selectedStatus = document.getElementById('statusFilter').value;
            const selectedMonth = document.getElementById('monthFilter').value;

            const rows = document.querySelectorAll('#managementTable tr');

            rows.forEach(row => {
                const nameText = row.querySelector('.emp-name').innerText.toLowerCase();
                const rowCompany = row.getAttribute('data-company');
                const rowDept = row.getAttribute('data-dept');
                const rowStatus = row.getAttribute('data-status');
                const rowDate = row.getAttribute('data-date'); 
                const rowMonth = rowDate ? rowDate.split('-')[1] : '';

                const matchesSearch = (searchVal === '' || nameText.includes(searchVal));
                const matchesCompany = (selectedCompany === 'ALL' || rowCompany === selectedCompany);
                const matchesDept = (selectedDept === 'ALL' || rowDept === selectedDept);
                const matchesStatus = (selectedStatus === 'ALL' || rowStatus === selectedStatus);
                const matchesMonth = (selectedMonth === 'ALL' || rowMonth === selectedMonth);

                if (matchesSearch && matchesCompany && matchesDept && matchesStatus && matchesMonth) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Excel Export
        function exportToExcel() {
            const visibleTable = document.createElement('table');
            const headerHtml = `<thead>
                <tr>
                    <th>Report Date</th><th>Company</th><th>Dept</th><th>Employee Name</th>
                    <th>Leave Details</th><th>Reason</th><th>Days</th><th>Status</th><th>Approved By</th>
                </tr>
            </thead>`;
            
            let bodyHtml = '<tbody>';
            document.querySelectorAll('#managementTable tr').forEach(row => {
                if (row.style.display !== 'none') {
                    bodyHtml += `<tr>
                        <td>${row.cells[0].innerText}</td>
                        <td>${row.cells[1].innerText}</td>
                        <td>${row.cells[2].innerText}</td>
                        <td>${row.cells[3].innerText}</td>
                        <td>${row.cells[4].innerText}</td>
                        <td>${row.cells[5].innerText}</td>
                        <td>${row.cells[6].innerText}</td>
                        <td>${row.cells[7].innerText}</td>
                        <td>${row.cells[8].innerText}</td>
                    </tr>`;
                }
            });
            bodyHtml += '</tbody>';

            visibleTable.innerHTML = headerHtml + bodyHtml;
            const workbook = XLSX.utils.table_to_book(visibleTable, { sheet: "Leave Records" });
            XLSX.writeFile(workbook, "Leave_Records_Report.xlsx");
        }

        // PDF Export
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');

            doc.setFontSize(16);
            doc.text("Management Panel - Leave Records Report", 14, 15);

            const headers = [
                ["Report Date", "Company", "Dept", "Employee Name", "Leave Details", "Reason", "Days", "Status", "Approved By"]
            ];

            const rowsData = [];
            document.querySelectorAll('#managementTable tr').forEach(row => {
                if (row.style.display !== 'none') {
                    rowsData.push([
                        row.cells[0].innerText,
                        row.cells[1].innerText,
                        row.cells[2].innerText,
                        row.cells[3].innerText,
                        row.cells[4].innerText,
                        row.cells[5].innerText,
                        row.cells[6].innerText,
                        row.cells[7].innerText,
                        row.cells[8].innerText
                    ]);
                }
            });

            doc.autoTable({
                head: headers,
                body: rowsData,
                startY: 22,
                theme: 'grid',
                headStyles: { fillColor: [15, 23, 42] },
                styles: { fontSize: 9, cellPadding: 3 }
            });

            doc.save("Leave_Records_Report.pdf");
        }
    </script>
</body>
